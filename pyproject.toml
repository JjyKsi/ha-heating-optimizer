[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-heating-optimizer"
version = "0.0.0"
description = "Home Assistant integration for porssisahko.net electricity prices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-homeassistant-custom-component>=0.15.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
